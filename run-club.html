<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Club — Blue Hour Coffee</title>
<meta name="description" content="Sunday Run Club on the Oak Leaf Trail — the crew, the miles, and the coffee after.">
<link rel="icon" href="IMAGES/blue-hour-logo.png">
<style>
  :root{
    --cream:#F6F0E3;
    --cream-2:#EDE4D1;
    --blue:#1a1a1a;
    --blue-deep:#000;
    --coral:#E76A3C;
    --grot:"Helvetica Neue", Helvetica, Arial, sans-serif;
    --pad:clamp(1.6rem,3.2vw,3rem);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;}
  body{ font-family:var(--grot); font-weight:500;
    background:var(--cream); color:var(--blue);
    -webkit-font-smoothing:antialiased;
    line-height:1.5; }
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}

  /* header */
  header{ position:sticky; top:0; z-index:50;
    background:var(--cream); border-bottom:1px solid rgba(26,26,26,.12);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:1.4rem var(--pad); }
  header .back{ font-size:.84rem; letter-spacing:.14em; text-transform:uppercase; font-weight:500;
    display:inline-flex; align-items:center; gap:.5rem; }
  header .back .ar{ display:inline-block; transition:transform .35s var(--ease); }
  header .back:hover .ar{ transform:translateX(-4px); }
  header .logo{ justify-self:center; font-weight:700; text-transform:uppercase;
    font-size:clamp(.95rem,1.7vw,1.2rem); white-space:nowrap;
    display:inline-flex; align-items:center; gap:.45rem; letter-spacing:.02em; }
  header .logo sup{ font-size:.5em; top:-.7em; }
  header .logo .mark{ width:clamp(20px,1.9vw,28px); height:auto; }
  header .right{ justify-self:end; }

  /* hero */
  .gallery-head{ text-align:center; padding:clamp(4rem,7vw,7rem) var(--pad) clamp(2.4rem,4vw,3.4rem); }
  .gallery-head .eyebrow{ display:block; font-size:clamp(.64rem,.9vw,.78rem);
    letter-spacing:.22em; text-transform:uppercase; color:rgba(26,26,26,.6); font-weight:500; margin-bottom:1rem; }
  .gallery-head h1{ margin:0; font-weight:500; text-transform:lowercase;
    font-size:clamp(2.4rem,8.5vw,8rem); line-height:1; letter-spacing:-.04em; }
  .gallery-head .lede{ margin:1.8rem auto 0; font-size:clamp(.98rem,1.2vw,1.08rem);
    line-height:1.55; max-width:36rem; color:rgba(26,26,26,.78); }

  /* grid */
  .gallery{ padding:0 var(--pad) clamp(4rem,8vw,8rem); }
  .gallery-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(.6rem,1.2vw,1.2rem); }
  .gallery figure{ margin:0; position:relative; overflow:hidden;
    background:var(--cream-2); aspect-ratio:4/5; transition:transform .5s var(--ease); }
  .gallery figure:nth-child(7n+1){ aspect-ratio:4/5; }
  .gallery figure:nth-child(7n+3){ aspect-ratio:1/1; }
  .gallery figure:nth-child(7n+5){ aspect-ratio:5/4; }
  .gallery figure img{ width:100%; height:100%; object-fit:cover;
    transition:transform .8s var(--ease); }
  .gallery figure:hover img{ transform:scale(1.04); }
  .gallery figure .ph-label{ position:absolute; left:1rem; bottom:1rem;
    font-size:.64rem; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(26,26,26,.55); }

  /* footer */
  footer{ background:var(--blue); color:var(--cream); padding:clamp(3rem,5vw,5rem) var(--pad) clamp(2rem,3vw,3rem); }
  footer .foot-grid{ display:flex; justify-content:space-between; align-items:flex-end; gap:2rem; flex-wrap:wrap; }
  footer .foot-grid h2{ margin:0; font-weight:500; text-transform:lowercase;
    font-size:clamp(2rem,5vw,4rem); line-height:.95; letter-spacing:-.035em; }
  footer .foot-grid p{ margin:.4rem 0 0; color:rgba(246,240,227,.7);
    font-size:clamp(.85rem,1vw,.95rem); text-transform:lowercase; }
  footer .foot-bottom{ margin-top:3rem; padding-top:1.4rem; border-top:1px solid rgba(246,240,227,.18);
    display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
    font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(246,240,227,.55); }

  @media (max-width: 800px){
    .gallery-grid{ grid-template-columns:repeat(2,1fr); }
    header .back span:last-child{ display:none; }
  }
  @media (max-width: 520px){
    .gallery-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">
    <span class="ar" aria-hidden="true">←</span>
    <span>Back</span>
  </a>
  <a class="logo" href="index.html">
    <img class="mark" src="IMAGES/blue-hour-logo.png" alt="" aria-hidden="true">
    <span>Blue Hour Coffee<sup>™</sup></span>
  </a>
  <span class="right"></span>
</header>

<section class="gallery-head">
  <span class="eyebrow">Run Club · Oak Leaf Trail</span>
  <h1>run club</h1>
  <p class="lede">Every Sunday, every pace. The crew, the miles, and the coffee after — a look at the mornings we log together.</p>
</section>

<section class="gallery">
  <div class="gallery-grid">
    <figure><img alt="Run club gathering before the run" src="IMAGES/MRC-002.jpg"><span class="ph-label">01 — Meet Out Front</span></figure>
    <figure><img alt="Runners on the Oak Leaf Trail" src="IMAGES/MRC-003.jpg"><span class="ph-label">02 — Oak Leaf Trail</span></figure>
    <figure><span class="ph-label">03 — Placeholder</span></figure>
    <figure><span class="ph-label">04 — Placeholder</span></figure>
    <figure><span class="ph-label">05 — Placeholder</span></figure>
    <figure><span class="ph-label">06 — Placeholder</span></figure>
    <figure><span class="ph-label">07 — Placeholder</span></figure>
    <figure><span class="ph-label">08 — Placeholder</span></figure>
    <figure><span class="ph-label">09 — Placeholder</span></figure>
  </div>
</section>

<footer>
  <div class="foot-grid">
    <div>
      <h2>blue hour coffee</h2>
      <p>2410 n murray ave · milwaukee, wi 53211</p>
    </div>
    <div>
      <p><a href="index.html#run-club">back to run club section →</a></p>
    </div>
  </div>
  <div class="foot-bottom">
    <span>© Blue Hour Coffee</span>
    <span>Milwaukee, WI</span>
  </div>
</footer>

</body>
</html>
